name: Setup neko
description: Install the Neko build used by this compiler’s standard library
runs:
  using: composite
  steps:
  - name: Download the matching Neko runtime
    shell: bash
    run: |
      set -eu
      # This standard library uses separate semaphore primitives. Later Neko
      # builds merged them with locks without changing the 2.4.1 version.
      build=neko_2026-03-19_master_5f449dc
      archive=tar.gz
      if [ "$RUNNER_OS" = Windows ]; then archive=zip; fi
      curl --fail --silent --show-error --location --retry 3 --retry-delay 5 \
        "https://build.haxe.org/builds/neko/$PLATFORM/$build.$archive" \
        --output "$RUNNER_TEMP/neko.$archive"

  - name: Install Neko
    shell: pwsh
    if: runner.os == 'Windows'
    run: |
      Expand-Archive $env:RUNNER_TEMP/neko.zip -DestinationPath $env:RUNNER_TEMP
      $NEKOPATH = Get-ChildItem $env:RUNNER_TEMP/neko-*-*
      echo "$NEKOPATH" >> $env:GITHUB_PATH
      echo "NEKOPATH=$NEKOPATH" >> $env:GITHUB_ENV

  - name: Install Neko
    shell: bash
    if: runner.os != 'Windows'
    run: |
      set -ex

      tar -xf "$RUNNER_TEMP/neko.tar.gz" -C "$RUNNER_TEMP"
      NEKOPATH=`echo $RUNNER_TEMP/neko-*-*`
      sudo mkdir -p /usr/local/bin
      sudo mkdir -p /usr/local/include
      sudo mkdir -p /usr/local/lib/neko
      sudo ln -s $NEKOPATH/{neko,nekoc,nekoml,nekotools}  /usr/local/bin/
      sudo ln -s $NEKOPATH/libneko.*                      /usr/local/lib/
      sudo ln -s $NEKOPATH/include/*                      /usr/local/include/
      sudo ln -s $NEKOPATH/*.ndll                         /usr/local/lib/neko/
      echo "NEKOPATH=$NEKOPATH" >> $GITHUB_ENV

  - name: Print Neko version
    shell: bash
    run: neko -version 2>&1
